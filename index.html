<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO list</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header id="input-container">
        <h1>TODO list</h1>
        <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>

    <main>
        <form id="task-form">
            <label class="task-field task-name" for="task-input">
                <span>Task</span>
                <input id="task-input" type="text" placeholder="What needs doing?" required>
            </label>
            <label class="task-field" for="due-date">
                <span>Due date</span>
                <input id="due-date" type="date">
            </label>
            <label class="task-field" for="priority">
                <span>Priority</span>
                <select id="priority">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>
            </label>
            <button id="addbtn" type="submit">ADD</button>
        </form>

        <section id="todo-container" aria-label="Tasks">
            <ul aria-live="polite"></ul>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
